<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apuração Kombat</title>
    <meta name="description" content="A apuração do 2º turno presidencial de 2026 como uma luta de fliperama, com dados oficiais do TSE." />
    <!-- ao trocar para domínio próprio, atualize as URLs absolutas abaixo -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://denisgermano.github.io/apuracao-kombat/" />
    <meta property="og:title" content="Apuração Kombat · 2º turno 2026" />
    <meta property="og:description" content="Lula x Flávio Bolsonaro: a apuração oficial do TSE ao vivo, golpe a golpe, como uma luta de fliperama." />
    <meta property="og:image" content="https://denisgermano.github.io/apuracao-kombat/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apuração Kombat · 2º turno 2026" />
    <meta name="twitter:description" content="Lula x Flávio Bolsonaro: a apuração oficial do TSE ao vivo, golpe a golpe, como uma luta de fliperama." />
    <meta name="twitter:image" content="https://denisgermano.github.io/apuracao-kombat/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="arena">
      <div class="sky"></div>
      <svg class="congress" viewBox="0 0 800 220" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <defs>
          <linearGradient id="congress-real" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a3f4f" />
            <stop offset="0.7" stop-color="#1a1c24" />
            <stop offset="1" stop-color="#0c0d12" />
          </linearGradient>
        </defs>
        <rect x="372" y="20" width="22" height="160" />
        <rect x="406" y="20" width="22" height="160" />
        <rect x="372" y="70" width="56" height="8" />
        <path d="M180 150 Q240 205 300 150 Z" />
        <path d="M500 175 Q560 120 620 175 Z" />
        <rect x="120" y="165" width="560" height="14" />
        <rect x="40" y="179" width="720" height="41" />
      </svg>
      <div class="floor"></div>
      <div class="atmo fog" aria-hidden="true"></div>
      <div class="atmo vignette" aria-hidden="true"></div>
      <div class="atmo grain" aria-hidden="true"></div>

      <header id="hud">
        <div class="side s0">
          <div class="name" id="name-0">—</div>
          <div class="bar" id="bar-0"><div class="trail"></div><div class="fill"></div><div class="mark50" title="50%"></div></div>
          <div class="stats" id="stats-0"></div>
        </div>
        <div class="center">
          <div id="clock">99</div>
          <div id="apuradas">0,00% das seções</div>
        </div>
        <div class="side s1">
          <div class="name" id="name-1">—</div>
          <div class="bar" id="bar-1"><div class="trail"></div><div class="fill"></div><div class="mark50" title="50%"></div></div>
          <div class="stats" id="stats-1"></div>
        </div>
      </header>

      <div id="stage"></div>
      <div id="announcer"></div>
      <button id="win-cta" type="button" hidden>☕ CURTIU A LUTA? APOIE VIA PIX</button>
      <a id="credit" target="_blank" rel="noopener"></a>

      <footer id="status">
        <span id="status-text">● conectando ao TSE…</span>
        <span id="updated"></span>
        <button id="pix" type="button" title="Apoie o projeto via Pix">☕ PIX</button>
        <button id="style" type="button" title="Trocar estilo visual"></button>
        <button id="mute" type="button"></button>
      </footer>
    </main>

    <dialog id="pix-dialog" aria-labelledby="pix-title">
      <h2 id="pix-title">APOIE O LUTADOR</h2>
      <p>Pague um café pro projeto. Qualquer valor ajuda a manter a arena de pé.</p>
      <div id="pix-qr" role="img" aria-label="QR Code Pix"></div>
      <p class="pix-hint">Abra o app do banco, escolha Pix › Ler QR Code<br />ou use o Pix Copia e Cola:</p>
      <button id="pix-copy" type="button">COPIAR CÓDIGO PIX</button>
      <p class="pix-key">Chave aleatória:<br /><code id="pix-key"></code></p>
      <button id="pix-close" type="button" aria-label="Fechar">×</button>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
